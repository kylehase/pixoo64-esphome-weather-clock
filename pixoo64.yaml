esphome:
  name: pixoo64
  friendly_name: pixoo64
  min_version: 2026.4.0
  name_add_mac_suffix: false
  includes:
    - pixoo_bitmaps.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

# Hardware SPI Bus connected to Pixoo-64 LED Driver MCU
spi:
  clk_pin: GPIO25
  mosi_pin: GPIO33

# Native Pixoo Display Driver
display:
  - platform: pixoo
    id: pixoo_display
    model: 64x64
    cs_pin: GPIO26
    update_interval: 500ms
    lambda: |-
      auto now = id(ha_time).now();
      bool is_late_night = now.is_valid() && (now.hour >= 22 || now.hour < 7 || (now.hour == 7 && now.minute < 30));

      // 0. Adaptive 2-Stage Room Dimming (Ultra-dim floor only during late night 22:00-07:30)
      float lux = id(bedroom_lux).state;
      float hw_target = 0.50f;
      float rgb_target = 1.00f;
      if (!isnan(lux)) {
        float lx = std::max(0.0f, lux);
        if (lx <= 5.0f) {
          hw_target = 0.01f;
        } else {
          float t = std::min(1.0f, log1pf(lx - 5.0f) / log1pf(145.0f));
          hw_target = 0.01f + 0.89f * powf(t, 0.85f);
        }
        if (is_late_night) {
          if (lx <= 3.0f) {
            rgb_target = 0.045f;
          } else if (lx < 10.0f) {
            float u = (lx - 3.0f) / 7.0f;
            rgb_target = 0.045f + 0.955f * (u * u);
          }
        }
      }
      if (!is_late_night) {
        hw_target = std::max(hw_target, 0.25f);
        rgb_target = 1.00f;
      }
      const auto &bl_state = id(bedroom_light_state).state;
      if (bl_state == "on" || bl_state == "max") {
        hw_target = std::max(hw_target, 0.55f);
        rgb_target = 1.00f;
      }
      static float s_hw = -1.0f;
      static float s_rgb = -1.0f;
      static float s_last_sent_hw = -1.0f;
      if (s_hw < 0.0f) {
        s_hw = hw_target;
        s_rgb = rgb_target;
      } else {
        s_hw += 0.35f * (hw_target - s_hw);
        s_rgb += 0.35f * (rgb_target - s_rgb);
      }
      if (s_last_sent_hw < 0.0f || fabsf(s_hw - s_last_sent_hw) >= 0.005f) {
        auto call = id(pixoo_backlight).make_call();
        call.set_state(true);
        call.set_brightness(s_hw);
        call.set_transition_length(0);
        call.perform();
        s_last_sent_hw = s_hw;
      }
      pixoo_gfx::DimmingDisplay<decltype(it)> canvas{it, s_rgb};

      // 1. Header: Date & 2. Hero Clock
      if (now.is_valid()) {
        std::string dow = now.strftime("%a");
        for (auto &c : dow) c = toupper(c);
        char dom_buf[8];
        snprintf(dom_buf, sizeof(dom_buf), "%02d", now.day_of_month);
        pixoo_gfx::draw_text_5x7(canvas, 16, 1, dow.c_str(), pixoo_gfx::C_GRAY_SUBDUED);
        pixoo_gfx::draw_text_5x7(canvas, 36, 1, dom_buf, pixoo_gfx::C_WHITE_BRIGHT);
        pixoo_gfx::draw_hero_clock(canvas, 10, 10, now.hour, now.minute, pixoo_gfx::C_CLOCK_RED);
      } else {
        pixoo_gfx::draw_text_5x7(canvas, 16, 1, "SYN", pixoo_gfx::C_GRAY_SUBDUED);
        pixoo_gfx::draw_hero_clock(canvas, 10, 10, 0, 0, pixoo_gfx::C_CLOCK_RED);
      }

      // 3. Row 3: Current Live Climate (50% Split Left/Right Centered)
      // Left Column (X=0..31): Thermometer (5px) + 2px gap + Temp
      float t = id(current_temp).state;
      if (!isnan(t)) {
        int t10 = (int) roundf(t * 10.0f);
        int t_int = t10 / 10;
        char int_buf[16];
        snprintf(int_buf, sizeof(int_buf), "%d", t_int);
        int int_len = strlen(int_buf);
        int int_w = int_len * 5 + (int_len - 1) * 1;
        int temp_w = int_w + 1 + 1 + 3 + 1 + 3; // digits + 1px gap + dot + 1px gap + dec(3px) + 1px gap + deg(3px)
        int total_w = 5 + 2 + temp_w;
        int start_x = std::max(0, (32 - total_w) / 2);

        pixoo_gfx::draw_flat_thermometer(canvas, start_x, 28, pixoo_gfx::C_WARMER_CORAL);
        pixoo_gfx::draw_tight_temp_5x7(canvas, start_x + 5 + 2, 29, t, pixoo_gfx::C_WHITE_BRIGHT, pixoo_gfx::C_WHITE_MID);
      } else {
        pixoo_gfx::draw_flat_thermometer(canvas, 7, 28, pixoo_gfx::C_WARMER_CORAL);
        pixoo_gfx::draw_text_5x7(canvas, 14, 29, "--", pixoo_gfx::C_GRAY_SUBDUED);
      }

      // Right Column (X=32..63): Droplet (5px) + 2px gap + Humidity
      float h = id(current_humidity).state;
      if (!isnan(h)) {
        char hum_buf[8];
        snprintf(hum_buf, sizeof(hum_buf), "%d%%", (int) roundf(h));
        int hum_len = strlen(hum_buf);
        int hum_w = hum_len * 5 + (hum_len - 1) * 1;
        int total_w = 5 + 2 + hum_w;
        int start_x = 32 + std::max(0, (32 - total_w) / 2);

        pixoo_gfx::draw_organic_droplet(canvas, start_x, 29, pixoo_gfx::C_RAIN_BLUE);
        pixoo_gfx::draw_text_5x7(canvas, start_x + 5 + 2, 29, hum_buf, pixoo_gfx::C_WHITE_MID);
      } else {
        pixoo_gfx::draw_organic_droplet(canvas, 40, 29, pixoo_gfx::C_RAIN_BLUE);
        pixoo_gfx::draw_text_5x7(canvas, 47, 29, "--%", pixoo_gfx::C_GRAY_SUBDUED);
      }

      // 4. Row 4: Forecast Context (50% Split Left/Right Centered)
      // Left Column (X=0..31): Chevron (5px) + 2px gap + Trend ("+4*")
      float diff = id(temp_diff).state;
      if (!isnan(diff)) {
        int idiff = (int) roundf(diff);
        bool warmer = idiff >= 0;
        char diff_buf[10];
        snprintf(diff_buf, sizeof(diff_buf), "%+d*", idiff);
        int text_len = strlen(diff_buf);
        int text_w = (text_len - 1) * 5 + 4; // digits/sign are 5px step, '*' is 4px step
        int total_w = 5 + 2 + text_w;
        int start_x = std::max(0, (32 - total_w) / 2);

        pixoo_gfx::draw_chevron(canvas, start_x, 39, warmer, warmer ? pixoo_gfx::C_WARMER_CORAL : pixoo_gfx::C_COLDER_BLUE);
        pixoo_gfx::draw_text_micro(canvas, start_x + 5 + 2, 39, diff_buf, pixoo_gfx::C_WHITE_BRIGHT);
      }

      // Right Column (X=32..63): Min Temp ("9*") + 3px gap + Max Temp ("18*")
      float t_min = id(temp_min).state;
      float t_max = id(temp_max).state;
      if (!isnan(t_min) && !isnan(t_max)) {
        char min_buf[8], max_buf[8];
        snprintf(min_buf, sizeof(min_buf), "%d*", (int) roundf(t_min));
        snprintf(max_buf, sizeof(max_buf), "%d*", (int) roundf(t_max));
        int w_min = (strlen(min_buf) - 1) * 5 + 4;
        int w_max = (strlen(max_buf) - 1) * 5 + 4;
        int gap = 3;
        int total_w = w_min + gap + w_max;
        int start_x = 32 + std::max(0, (32 - total_w) / 2);

        pixoo_gfx::draw_text_micro(canvas, start_x, 39, min_buf, pixoo_gfx::C_TEMP_MIN);
        pixoo_gfx::draw_text_micro(canvas, start_x + w_min + gap, 39, max_buf, pixoo_gfx::C_TEMP_MAX);
      } else if (!isnan(t_min)) {
        char min_buf[8];
        snprintf(min_buf, sizeof(min_buf), "%d*", (int) roundf(t_min));
        int w_min = (strlen(min_buf) - 1) * 5 + 4;
        int start_x = 32 + std::max(0, (32 - w_min) / 2);
        pixoo_gfx::draw_text_micro(canvas, start_x, 39, min_buf, pixoo_gfx::C_TEMP_MIN);
      } else if (!isnan(t_max)) {
        char max_buf[8];
        snprintf(max_buf, sizeof(max_buf), "%d*", (int) roundf(t_max));
        int w_max = (strlen(max_buf) - 1) * 5 + 4;
        int start_x = 32 + std::max(0, (32 - w_max) / 2);
        pixoo_gfx::draw_text_micro(canvas, start_x, 39, max_buf, pixoo_gfx::C_TEMP_MAX);
      }

      // 5. Row 5: Dynamic Context Bottom Bar
      const auto &cond = id(weather_condition).state;
      const auto &sun = id(sun_state).state;
      float precip = id(precip_max).state;
      float uv = id(uv_index).state;
      float wind = id(wind_speed).state;
      bool is_night = (sun == "below_horizon") || (cond == "clear-night") || (sun.empty() && now.is_valid() && (now.hour < 6 || now.hour >= 18));
      bool has_rain = (!isnan(precip) && precip > 0.0f);
      bool has_wind = (!isnan(wind) && wind >= 25.0f) && (cond != "windy" && cond != "windy-variant");
      bool has_pollen = id(alert_pollen).state;

      // Left 1x14px Smooth Gradient Bars (X=0: Rain, X=2: UV, Y=48..61)
      if (has_rain) {
        int bar_h = std::max(1, std::min(14, (int) roundf(precip * 14.0f / 20.0f)));
        pixoo_gfx::draw_gradient_bar(canvas, 0, 61, bar_h, true);
      }
      if (!is_night && !isnan(uv) && uv >= 1.0f) {
        int bar_h = std::max(1, std::min(14, (int) roundf(uv * 14.0f / 11.0f)));
        pixoo_gfx::draw_gradient_bar(canvas, 2, 61, bar_h, false);
      }

      // Primary 14x14 Weather Icon (X=4..17, Y=48..61)
      pixoo_gfx::draw_weather_icon_14x14(canvas, 4, 48, cond, is_night);

      // Right Context Area (X=21..62): Badges + Shiba Inu if space remains
      int bx = 21;
      if (has_rain) {
        char rain_buf[16];
        snprintf(rain_buf, sizeof(rain_buf), "%dmm", std::max(1, (int) roundf(precip)));
        pixoo_gfx::draw_text_micro(canvas, bx, 52, rain_buf, pixoo_gfx::C_RAIN_BLUE);
        bx += strlen(rain_buf) * 5 + 3;
      }
      if (has_wind && bx + 12 <= 63) {
        pixoo_gfx::draw_wind_badge_12x10(canvas, bx, 50);
        bx += 12 + 3;
      }
      if (has_pollen && bx + 8 <= 63) {
        pixoo_gfx::draw_cedar_tree_7x7(canvas, bx, 51);
        bx += 8 + 3;
      }

      uint32_t tick = millis() / 500;
      int avail = 63 - bx;
      if (bx == 21) {
        if (is_night) {
          pixoo_gfx::draw_shiba_night_frame(canvas, 33, 52, tick % 8);
        } else {
          // Full-length walk back and forth across X=21..49
          int phase = tick % 56;
          bool going_right = (phase < 28);
          int sx = going_right ? (21 + phase) : (49 - (phase - 28));
          pixoo_gfx::draw_shiba_walk_frame(canvas, sx, 52, tick % 4, going_right);
        }
      } else if (avail >= 16) {
        if (is_night) {
          int sx = bx + (avail - 15) / 2;
          pixoo_gfx::draw_shiba_night_frame(canvas, sx, 52, tick % 8);
        } else {
          int sx = bx + (avail - 14) / 2;
          pixoo_gfx::draw_shiba_day_frame(canvas, sx, 50, tick % 8);
        }
      }

# Native Brightness Control Light Entity (Always ON at boot!)
light:
  - platform: pixoo
    id: pixoo_backlight
    pixoo_id: pixoo_display
    name: "Pixoo Brightness"
    restore_mode: ALWAYS_ON

# Time Synchronization
time:
  - platform: homeassistant
    id: ha_time

# Home Assistant Sensors (Native API)
sensor:
  - platform: homeassistant
    id: current_temp
    entity_id: weather.forecast_home
    attribute: temperature

  - platform: homeassistant
    id: current_humidity
    entity_id: weather.forecast_home
    attribute: humidity

  - platform: homeassistant
    id: temp_diff
    entity_id: sensor.pixoo_temp_diff

  - platform: homeassistant
    id: temp_min
    entity_id: sensor.pixoo_temp_min

  - platform: homeassistant
    id: temp_max
    entity_id: sensor.pixoo_temp_max

  - platform: homeassistant
    id: precip_max
    entity_id: sensor.pixoo_precip_max

  - platform: homeassistant
    id: uv_index
    entity_id: sensor.rack_openuv_max_uv_index

  - platform: homeassistant
    id: wind_speed
    entity_id: weather.forecast_home
    attribute: wind_speed

  - platform: homeassistant
    id: bedroom_lux
    entity_id: sensor.bedroom_motion_illuminance

binary_sensor:
  - platform: homeassistant
    id: alert_pollen
    entity_id: binary_sensor.pixoo_alert_pollen

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.forecast_home

  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun

  - platform: homeassistant
    id: bedroom_light_state
    entity_id: light.bedroom_light
